<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ORIGIN_TRIAL_TOKENS: injected at deploy time by scripts/inject-token.mjs -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Inline SVG favicon as a data URI. A linked icon file would be the only network request the page
  makes after load, and "this page makes no requests" is easier to demonstrate when it is
  literally true — including in a DevTools Network tab on camera.
-->
<!--
  Swiss mark: a white field, a black seal, and the Swiss Red quadrant that stands for the one
  thing the boundary lets through. Still an inline data URI, so it costs no network request.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23000' stroke-width='4'/%3E%3Crect x='14' y='0' width='4' height='32' fill='%23fff'/%3E%3Crect x='0' y='0' width='6' height='6' fill='%23FF3000'/%3E%3C/svg%3E">
<!-- Matches the white masthead. -->
<meta name="theme-color" content="#ffffff">
<title>Airlock — your agent analyses data it never sees</title>
<meta name="description" content="5,000 compensation records are generated in this tab and stay there. Your AI agent audits them through a bounded, budgeted, fully audited WebMCP tool interface, and never receives an individual record.">
</head>
<body>
<div id="root"></div>
<noscript>Airlock requires JavaScript: the entire application, including the dataset, runs in this tab.</noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
